# نشر كامل: واجهة + API + PostgreSQL على Render
# رابط النشر: https://render.com/deploy?repo=https://github.com/moneerafahaid-collab/oshiba-saudi-rural
# مهم: Blueprint Path = render.yaml (جذر المشروع — ليس backend/render.yaml)

databases:
  - name: oshiba-db
    plan: free
    databaseName: reef_saudi
    user: reef

services:
  - type: web
    name: oshiba-saudi-rural
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build && cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: oshiba-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
