# نشر كامل: واجهة + API + PostgreSQL على Render
# Blueprint Path = render.yaml (جذر المشروع)

databases:
  - name: oshiba-db
    plan: free
    databaseName: reef_saudi
    user: reef

services:
  - type: web
    name: oshiba-saudi-rural
    runtime: node
    plan: free
    # مهم: لا تضع NODE_ENV=production أثناء البناء — يمنع تثبيت Vite
    buildCommand: npm install --include=dev && npm run build && cd backend && npm install
    startCommand: cd backend && NODE_ENV=production node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: DATABASE_URL
        fromDatabase:
          name: oshiba-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
